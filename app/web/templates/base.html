<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Time Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">Time Tracker</a>
        <div class="nav-links">
            <a href="/?view=day">Day</a>
            <a href="/?view=week">Week</a>
            <a href="/?view=month">Month</a>
            <a href="/settings">Settings</a>
            <select id="tz-select" style="font-size:0.75rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--surface2);border-radius:4px;padding:2px 4px;margin-left:8px;cursor:pointer"
                    onchange="setDisplayTimezone(this.value)">
            </select>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}

    <script>
    // Timezone handling — runs AFTER main content is in the DOM
    const COMMON_TZS = [
        'UTC',
        'America/New_York','America/Chicago','America/Denver','America/Los_Angeles',
        'Europe/London','Europe/Paris','Europe/Berlin',
        'Asia/Kolkata','Asia/Dhaka','Asia/Shanghai','Asia/Tokyo',
        'Australia/Sydney','Pacific/Auckland',
    ];

    function getDisplayTz() {
        return localStorage.getItem('display_tz') || Intl.DateTimeFormat().resolvedOptions().timeZone;
    }

    function setDisplayTimezone(tz) {
        localStorage.setItem('display_tz', tz);
        convertTimesToTz(tz);
    }

    function convertTimesToTz(tz) {
        document.querySelectorAll('.utc-time').forEach(el => {
            const utc = el.dataset.utc;
            if (!utc) { el.textContent = 'now'; return; }
            try {
                const d = new Date(utc.replace(' ', 'T') + 'Z');
                el.textContent = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone: tz });
            } catch(e) {}
        });
    }

    // Build dropdown and convert times
    (function() {
        const sel = document.getElementById('tz-select');
        if (!sel) return;
        const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const savedTz = getDisplayTz();
        const allTzs = new Set(COMMON_TZS);
        allTzs.add(localTz);
        [...allTzs].sort().forEach(tz => {
            const opt = document.createElement('option');
            opt.value = tz;
            try {
                const abbr = new Date().toLocaleTimeString('en-US', {timeZoneName:'short', timeZone:tz}).split(' ').pop();
                opt.textContent = abbr + ' (' + tz.split('/').pop().replace(/_/g,' ') + ')';
            } catch(e) { opt.textContent = tz; }
            if (tz === savedTz) opt.selected = true;
            sel.appendChild(opt);
        });
        convertTimesToTz(savedTz);
    })();
    </script>
</body>
</html>
