<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; width: 380px; }
.top-link { text-align: right; margin-bottom: 6px; font-size: 10px; color: #6B7FFF; }
h2 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
.box { background: #222244; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
.label { font-size: 11px; color: #888; }
.desc { font-size: 13px; margin-top: 3px; }
.proj { font-size: 11px; color: #999; margin-top: 2px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; margin-bottom: 4px; }
.check input { accent-color: #6B7FFF; }
.buttons { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
button { padding: 6px 16px; font-size: 12px; border: none; border-radius: 6px; }
.btn-new { background: #333; color: #999; }
.btn-continue { background: #6B7FFF; color: #fff; }
</style></head><body>
<div class="top-link">Dashboard &#8599;</div>
<h2>Welcome back!</h2>
<div class="box">
  <div class="label">You were working on:</div>
  <div class="desc">Refactoring auth module, fixing token refresh</div>
  <div class="proj">Work</div>
</div>
<div class="check">
  <input type="checkbox"> <span>Did you take a break?</span>
</div>
<div class="buttons">
  <button class="btn-new">New Task</button>
  <button class="btn-continue">Continue</button>
</div>
</body></html>
